name: Build Android APKs

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install & Run Gradle 8.2
        run: |
          # Download portable Gradle 8.2 with Android plugin support
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          export PATH=$PWD/gradle-8.2/bin:$PATH
          
          mkdir -p output_apks

          for dir in android-villager/app android-pdo/app android-worker/app; do
            if [ -d "$dir" ]; then
              echo "=== Building $dir ==="
              cd "$dir"
              gradle assembleDebug --stacktrace --no-daemon || true
              cd "$GITHUB_WORKSPACE"
            fi
          done

          find . -name "*.apk" -exec cp {} output_apks/ \;
          ls -la output_apks/

      - name: Upload APKs as Direct Downloads
        uses: actions/upload-artifact@v4
        with:
          name: SmartVillage-3-APKs
          path: output_apks/*.apk
          if-no-files-found: warn
