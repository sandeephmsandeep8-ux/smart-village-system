name: Build Android APKs

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build All APKs
        run: |
          mkdir -p output_apks

          for app in android-villager android-pdo android-worker; do
            if [ -d "$app" ]; then
              echo "Building $app..."
              cd "$app"
              # Generate gradle wrapper and assemble debug apk
              gradle wrapper || true
              chmod +x gradlew || true
              ./gradlew assembleDebug --no-daemon || true
              cd ..
            fi
          done

          # Find and copy all built APKs
          find . -name "*.apk" -exec cp {} output_apks/ \;
          ls -la output_apks/

      - name: Upload APKs as Direct Downloads
        uses: actions/upload-artifact@v4
        with:
          name: SmartVillage-3-APKs
          path: output_apks/*.apk
          if-no-files-found: ignore
