name: Build Android APKs

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build APKs using Built-in Android Tools
        run: |
          mkdir -p output_apks

          # Export pre-installed Android SDK environment
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH

          echo "Android SDK location: $ANDROID_HOME"

          # Process and build each app
          for app in android-villager android-pdo android-worker; do
            if [ -d "$app" ]; then
              echo "=========================================="
              echo "Building $app"
              echo "=========================================="

              # Create root settings.gradle and build.gradle if missing
              if [ ! -f "$app/settings.gradle" ]; then
                echo "include ':app'" > "$app/settings.gradle"
              fi

              if [ ! -f "$app/build.gradle" ]; then
                cat << 'EOF' > "$app/build.gradle"
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.4'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0'
    }
}
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
EOF
              fi

              cd "$app"
              gradle assembleDebug --stacktrace --no-daemon || true
              cd "$GITHUB_WORKSPACE"
            fi
          done

          # Gather all produced APK files
          echo "=========================================="
          echo "Searching for APK files..."
          find . -name "*.apk" -exec cp -v {} output_apks/ \;
          ls -la output_apks/

      - name: Upload APKs as Direct Downloads
        uses: actions/upload-artifact@v4
        with:
          name: SmartVillage-3-APKs
          path: output_apks/*.apk
          if-no-files-found: ignore
