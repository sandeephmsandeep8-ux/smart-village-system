name: Build Android APKs

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android Apps
        run: |
          mkdir -p output_apks
          for dir in android-villager/app android-pdo/app android-worker/app; do
            if [ -d "$dir" ]; then
              cd "$dir"
              gradle assembleDebug || true
              cd $GITHUB_WORKSPACE
            fi
          done
          find . -name "*.apk" -exec cp {} output_apks/ \;
          ls -la output_apks/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SmartVillage-3-APKs
          path: output_apks/*.apk
          if-no-files-found: ignore
