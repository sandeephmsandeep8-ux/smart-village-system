name: Build Android APKs

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Standalone APKs
        run: |
          mkdir -p output_apks

          for app in android-villager android-pdo android-worker; do
            if [ -d "$app/app" ]; then
              echo "=== Configuring $app ==="
              # Create settings.gradle so gradle recognizes it as a valid project
              echo "include ':app'" > "$app/settings.gradle"
              
              cd "$app"
              gradle :app:assembleDebug --stacktrace --no-daemon || true
              cd "$GITHUB_WORKSPACE"
            fi
          done

          find . -name "*.apk" -exec cp {} output_apks/ \;
          ls -la output_apks/

      - name: Upload APKs as Direct Downloads
        uses: actions/upload-artifact@v4
        with:
          name: SmartVillage-3-APKs
          path: output_apks/*.apk
          if-no-files-found: ignore
