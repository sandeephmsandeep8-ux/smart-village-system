name: Build Android APKs

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build All APKs
        run: |
          mkdir -p output_apks

          # Install gradle on ubuntu runner
          sudo apt-get update && sudo apt-get install -y gradle

          # Build each app
          for dir in android-villager/app android-pdo/app android-worker/app; do
            if [ -d "$dir" ]; then
              echo "=== Building $dir ==="
              cd "$dir"
              gradle assembleDebug || true
              cd "$GITHUB_WORKSPACE"
            fi
          done

          # Find and copy all APKs
          find . -name "*.apk" -exec cp {} output_apks/ \;
          ls -la output_apks/

      - name: Upload APKs as Direct Downloads
        uses: actions/upload-artifact@v4
        with:
          name: SmartVillage-3-APKs
          path: output_apks/*.apk
          if-no-files-found: ignore
