name: Build Android APKs

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APKs
        run: |
          mkdir -p output_apks
          for d in *; do
            if [ -d "$d/app" ]; then
              echo "include ':app'" > "$d/settings.gradle"
              cd "$d"
              gradle assembleDebug || true
              cd ..
            fi
          done
          find . -name "*.apk" -exec cp {} output_apks/ \;

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SmartVillage-3-APKs
          path: output_apks/*.apk
          if-no-files-found: ignore
